<svg viewBox="0 0 1101 208" width="1101" height="208" role="img" aria-label="Symbolic regression approach: numeric data is encoded, a transformer proposes candidate expressions, and each candidate is scored by fitting its constants against the data." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0 0 L8 3.2 L0 6.4 z" fill="currentColor" opacity="0.55"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55" marker-end="url(#arrow)">
    <path d="M209 87 L284 87"/>
    <path d="M511 87 L586 87"/>
    <path d="M813 87 L888 87"/>
  </g>
  <g font-family="Sora, sans-serif" text-anchor="middle">
    <rect x="12" y="55" width="197" height="64" rx="7" fill="var(--surface-raised)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="110" y="83" font-size="16" font-weight="700" fill="var(--text-primary)">(x, y) samples</text>
    <text x="110" y="102" font-size="14.5" fill="var(--text-muted)">real or synthetic</text>
    <rect x="288" y="55" width="223" height="64" rx="7" fill="var(--surface-card)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="400" y="83" font-size="16" font-weight="700" fill="var(--text-primary)">Set encoder</text>
    <text x="400" y="102" font-size="14.5" fill="var(--text-muted)">permutation invariant</text>
    <rect x="590" y="46" width="223" height="82" rx="7" fill="var(--surface-card)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="702" y="74" font-size="16" font-weight="700" fill="var(--text-primary)">Transformer decoder</text>
    <text x="702" y="93" font-size="14.5" fill="var(--text-muted)">emits expression</text>
    <text x="702" y="110" font-size="14.5" fill="var(--text-muted)">as a token sequence</text>
    <rect x="892" y="46" width="197" height="82" rx="7" fill="var(--accent-wash)" stroke="var(--accent)" stroke-width="1.4"/>
    <text x="990" y="74" font-size="16" font-weight="700" fill="var(--text-primary)">Fit and score</text>
    <text x="990" y="93" font-size="14.5" fill="var(--text-muted)">constants by least</text>
    <text x="990" y="110" font-size="14.5" fill="var(--text-muted)">squares</text>
    <text x="550" y="196" font-size="13" fill="var(--text-muted)">The model proposes a shape. Numerical fitting decides whether the shape was right.</text>
  </g>
</svg>
