<svg viewBox="0 0 1101 208" width="1101" height="208" role="img" aria-label="Intended Kavel pipeline: a seller photo is encoded, matched against comparable listings, and the retrieved comparables ground a generated title, description and attribute set." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0 0 L8 3.2 L0 6.4 z" fill="currentColor" opacity="0.55"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55" marker-end="url(#arrow)">
    <path d="M209 87 L284 87"/>
    <path d="M485 87 L560 87"/>
    <path d="M787 87 L862 87"/>
  </g>
  <g font-family="Sora, sans-serif" text-anchor="middle">
    <rect x="12" y="55" width="197" height="64" rx="7" fill="var(--surface-card)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="110" y="83" font-size="16" font-weight="700" fill="var(--text-primary)">Seller photo</text>
    <text x="110" y="102" font-size="14.5" fill="var(--text-muted)">one image, no text</text>
    <rect x="288" y="55" width="197" height="64" rx="7" fill="var(--surface-raised)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="386" y="83" font-size="16" font-weight="700" fill="var(--text-primary)">Vision encoder</text>
    <text x="386" y="102" font-size="14.5" fill="var(--text-muted)">image embedding</text>
    <rect x="564" y="55" width="223" height="64" rx="7" fill="var(--surface-card)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="676" y="83" font-size="16" font-weight="700" fill="var(--text-primary)">Retrieve comparables</text>
    <text x="676" y="102" font-size="14.5" fill="var(--text-muted)">nearest sold listings</text>
    <rect x="866" y="46" width="223" height="82" rx="7" fill="var(--accent-wash)" stroke="var(--accent)" stroke-width="1.4"/>
    <text x="978" y="74" font-size="16" font-weight="700" fill="var(--text-primary)">Grounded generation</text>
    <text x="978" y="93" font-size="14.5" fill="var(--text-muted)">title, description,</text>
    <text x="978" y="110" font-size="14.5" fill="var(--text-muted)">attributes</text>
    <text x="550" y="196" font-size="13" fill="var(--text-muted)">Retrieval first, generation second. The comparables are what keep the copy honest.</text>
  </g>
</svg>
