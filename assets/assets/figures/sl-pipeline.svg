<svg viewBox="0 0 1098 208" width="1098" height="208" role="img" aria-label="Sign language pipeline: webcam frame, fixed region of interest, running-average background subtraction, threshold, largest contour, then a CNN over the 64 by 64 binary mask." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0 0 L8 3.2 L0 6.4 z" fill="currentColor" opacity="0.55"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55" marker-end="url(#arrow)">
    <path d="M203 87 L275 87"/>
    <path d="M484 87 L556 87"/>
    <path d="M792 87 L864 87"/>
  </g>
  <g font-family="Sora, sans-serif" text-anchor="middle">
    <rect x="12" y="55" width="191" height="64" rx="7" fill="var(--surface-raised)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="108" y="83" font-size="16" font-weight="700" fill="var(--text-primary)">Webcam frame</text>
    <text x="108" y="102" font-size="14.5" fill="var(--text-muted)">flipped, 1 ROI</text>
    <rect x="279" y="46" width="205" height="82" rx="7" fill="var(--surface-card)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="382" y="74" font-size="16" font-weight="700" fill="var(--text-primary)">Background model</text>
    <text x="382" y="93" font-size="14.5" fill="var(--text-muted)">running average</text>
    <text x="382" y="110" font-size="14.5" fill="var(--text-muted)">over 60 frames</text>
    <rect x="560" y="46" width="232" height="82" rx="7" fill="var(--surface-card)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="676" y="74" font-size="16" font-weight="700" fill="var(--text-primary)">Segment hand</text>
    <text x="676" y="93" font-size="14.5" fill="var(--text-muted)">abs-diff, threshold 25,</text>
    <text x="676" y="110" font-size="14.5" fill="var(--text-muted)">largest contour</text>
    <rect x="868" y="46" width="218" height="82" rx="7" fill="var(--accent-wash)" stroke="var(--accent)" stroke-width="1.4"/>
    <text x="977" y="74" font-size="16" font-weight="700" fill="var(--text-primary)">CNN</text>
    <text x="977" y="93" font-size="14.5" fill="var(--text-muted)">64x64 mask,</text>
    <text x="977" y="110" font-size="14.5" fill="var(--text-muted)">10 classes</text>
    <text x="549" y="196" font-size="13" fill="var(--text-muted)">The hand is never detected. It is whatever moved after the background settled.</text>
  </g>
</svg>
