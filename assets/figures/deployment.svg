<svg viewBox="0 0 762 460" role="img" aria-label="Two images built from one source repository: a baked image built locally and deployed to Google Cloud Run, and a lean image built on Hugging Face servers that pulls its artifacts from a public dataset repository" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0 0 L8 3.2 L0 6.4 z" fill="currentColor" opacity="0.55"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55" marker-end="url(#arrow)">
    <path d="M152 180 L218 97"/>
    <path d="M152 180 L218 330"/>
    <path d="M448 97 L514 97"/>
    <path d="M448 330 L514 330"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.4" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <path d="M152 330 L218 330"/>
  </g>
  <g font-family="Sora, sans-serif" text-anchor="middle">
    <rect x="12" y="148" width="140" height="64" rx="7" fill="var(--accent-wash)" stroke="var(--accent)" stroke-width="1.4"/>
    <text x="82" y="176" font-size="13.5" font-weight="700" fill="var(--text-primary)">Source repo</text>
    <text x="82" y="194" font-size="11.5" fill="var(--text-muted)">two Dockerfiles</text>
    <rect x="12" y="298" width="140" height="64" rx="7" fill="var(--surface-raised)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="82" y="326" font-size="13.5" font-weight="700" fill="var(--text-primary)">mercato-artifacts</text>
    <text x="82" y="344" font-size="11.5" fill="var(--text-muted)">3.9 GB dataset</text>
    <rect x="222" y="56" width="226" height="82" rx="7" fill="var(--surface-card)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="335" y="84" font-size="13.5" font-weight="700" fill="var(--text-primary)">Dockerfile.baked</text>
    <text x="335" y="103" font-size="11.5" fill="var(--text-muted)">built locally</text>
    <text x="335" y="120" font-size="11.5" fill="var(--text-muted)">port 8000</text>
    <rect x="222" y="288" width="226" height="82" rx="7" fill="var(--surface-card)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="335" y="316" font-size="13.5" font-weight="700" fill="var(--text-primary)">Dockerfile.lean</text>
    <text x="335" y="336" font-size="11.5" fill="var(--text-muted)">built by Hugging Face</text>
    <text x="335" y="352" font-size="11.5" fill="var(--text-muted)">port 7860</text>
    <rect x="518" y="65" width="232" height="64" rx="7" fill="var(--surface-card)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="634" y="93" font-size="13.5" font-weight="700" fill="var(--text-primary)">Google Cloud Run</text>
    <text x="634" y="112" font-size="11.5" fill="var(--text-muted)">Tokyo, scales to zero</text>
    <rect x="518" y="298" width="232" height="64" rx="7" fill="var(--surface-card)" stroke="var(--border-strong)" stroke-width="1.2"/>
    <text x="634" y="326" font-size="13.5" font-weight="700" fill="var(--text-primary)">Hugging Face Space</text>
    <text x="634" y="344" font-size="11.5" fill="var(--text-muted)">free CPU tier</text>
    <text x="381" y="448" font-size="12" fill="var(--text-muted)">Two images. Where the build runs decides where the data comes from.</text>
  </g>
</svg>
